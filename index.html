<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMNA App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6 font-sans">

    <div class="glass p-8 rounded-[2rem] w-full max-w-sm text-center shadow-2xl">
        <h1 class="text-5xl font-black mb-1 tracking-tighter italic text-white">SOMNA</h1>
        <p class="text-blue-400 text-xs font-bold uppercase tracking-widest mb-10">System v1.0</p>
        
        <div class="space-y-4">
            <button id="mainBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-[0_0_20px_rgba(37,99,235,0.4)]">
                АКТИВИРОВАТЬ СОН
            </button>
            
            <button id="closeBtn" class="w-full border border-gray-700 hover:bg-gray-800 py-4 rounded-2xl font-medium text-gray-400 transition-all text-sm">
                ЗАКРЫТЬ
            </button>
        </div>

        <div class="mt-10 pt-6 border-t border-gray-800/50">
            <div class="flex justify-between text-[10px] font-bold text-gray-500 uppercase mb-2">
                <span>Battery Status</span>
                <span class="text-green-400">Online</span>
            </div>
            <div class="w-full bg-gray-900 h-1 rounded-full overflow-hidden">
                <div class="bg-blue-500 h-full w-[72%]"></div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Важные команды для Telegram
        tg.ready();
        tg.expand();
        tg.enableClosingConfirmation(); // Подтверждение при закрытии

        // Настройка главной кнопки Telegram (внизу)
        tg.MainButton.setText("ПОДДЕРЖКА SOMNA");
        tg.MainButton.show();

        // Логика кнопок интерфейса
        document.getElementById('mainBtn').onclick = () => {
            tg.HapticFeedback.impactOccurred('heavy');
            tg.showAlert("Режим сна активирован. Устройство SOMNA запущено.");
        };

        document.getElementById('closeBtn').onclick = () => {
            tg.close();
        };

        // Цвет темы под Telegram
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');
    </script>
</body>
</html>
